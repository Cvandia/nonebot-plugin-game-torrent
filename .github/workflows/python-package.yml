# This workflow installs locked dependencies, runs checks and tests, and builds the package.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "0.8.18"
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked --all-groups
    - name: Check syntax and undefined names
      run: uv run --locked ruff check nonebot_plugin_game_torrent --select E9,F63,F7,F82
    - name: Run tests
      run: uv run --locked --all-groups pytest -q
    - name: Build package
      run: uv build
